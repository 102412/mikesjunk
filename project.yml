name: Xpres
options:
  bundleIdPrefix: ai.xpres
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ''
    PRODUCT_NAME: Xpres
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Xpres.ai
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Select screenshots to share with the builder community.
    INFOPLIST_KEY_SUPABASE_URL: $(SUPABASE_URL)
    INFOPLIST_KEY_SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    INFOPLIST_KEY_AUTH_CALLBACK_URL: xpres://auth/callback
    SUPABASE_URL: ''
    SUPABASE_ANON_KEY: ''
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Xpres:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: ai.xpres.auth
            CFBundleURLSchemes: [xpres]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.xpres.builders
  XpresTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Xpres
schemes:
  Xpres:
    build:
      targets:
        Xpres: all
        XpresTests: [test]
    test:
      targets: [XpresTests]
